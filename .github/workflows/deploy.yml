name: Deploy KinEval Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            pathfinding/slides/package-lock.json
            cloth_simulation/slides/package-lock.json
            simulation/slides/package-lock.json
            forward_kinematics/slides/package-lock.json
            inverse_kinematics/slides/package-lock.json
            motion_planning/slides/package-lock.json
            behavior_trees/slides/package-lock.json

      - name: Build the pathfinding Slidev deck
        working-directory: pathfinding/slides
        run: |
          npm install
          npm run build

      - name: Build the cloth_simulation Slidev deck
        working-directory: cloth_simulation/slides
        run: |
          npm install
          npm run build

      - name: Build the simulation (Pendularm) Slidev deck
        working-directory: simulation/slides
        run: |
          npm install
          npm run build

      - name: Build the forward_kinematics Slidev deck
        working-directory: forward_kinematics/slides
        run: |
          npm install
          npm run build

      - name: Build the inverse_kinematics Slidev deck
        working-directory: inverse_kinematics/slides
        run: |
          npm install
          npm run build

      - name: Build the motion_planning Slidev deck
        working-directory: motion_planning/slides
        run: |
          npm install
          npm run build

      - name: Build the behavior_trees Slidev deck
        working-directory: behavior_trees/slides
        run: |
          npm install
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r pathfinding/slides/dist site/pathfinding
          cp -r cloth_simulation/slides/dist site/cloth_simulation
          cp -r simulation/slides/dist site/simulation
          cp -r forward_kinematics/slides/dist site/forward_kinematics
          cp -r inverse_kinematics/slides/dist site/inverse_kinematics
          cp -r motion_planning/slides/dist site/motion_planning
          cp -r behavior_trees/slides/dist site/behavior_trees
          # kineval/ is copied as a SOURCE tree, not a built one, and that
          # asymmetry with every other module here is deliberate: the full
          # viewer is buildless (plain <script src> plus one ES module), so
          # collision.js, motion_plan.js, random.js and worlds/ deploy with
          # no build step at all. motion_planning/ used to be copied the
          # same way, back when it was a static "coming soon" stub; now
          # that it is a real Slidev deck it must NOT be, because this copy
          # runs after the dist copies above and would merge the source
          # tree straight over the built deck -- replacing the deck's
          # index.html with the old stub while the workflow still went
          # green. That is why motion_planning was split out of this line.
          cp -r kineval site/
          # the 2D path-planning reference implementation is a plain,
          # dependency-free static app (no build step) -- serve it directly
          # at kineval/pathplanning/, alongside (not instead of) the
          # full-3D-viewer placeholder already copied into site/kineval/
          # above.
          mkdir -p site/kineval/pathplanning
          cp -r pathfinding/reference/. site/kineval/pathplanning/
          cp site/kineval/pathplanning/search_canvas.html site/kineval/pathplanning/index.html
          # same idea for the cloth-simulation reference implementation, but
          # served alongside its own deck (site/cloth_simulation/reference/)
          # rather than piggybacked under kineval/ the way pathfinding's is
          mkdir -p site/cloth_simulation/reference
          cp -r cloth_simulation/reference/. site/cloth_simulation/reference/
          cp site/cloth_simulation/reference/cloth_canvas.html site/cloth_simulation/reference/index.html
          # same idea again for the Pendularm reference implementation
          mkdir -p site/simulation/reference
          cp -r simulation/reference/. site/simulation/reference/
          cp site/simulation/reference/pendularm.html site/simulation/reference/index.html
          # same idea again for the forward-kinematics reference implementation
          mkdir -p site/forward_kinematics/reference
          cp -r forward_kinematics/reference/. site/forward_kinematics/reference/
          cp site/forward_kinematics/reference/forward_kinematics.html site/forward_kinematics/reference/index.html
          # same idea again for the inverse-kinematics reference implementation
          mkdir -p site/inverse_kinematics/reference
          cp -r inverse_kinematics/reference/. site/inverse_kinematics/reference/
          cp site/inverse_kinematics/reference/inverse_kinematics.html site/inverse_kinematics/reference/index.html
          # same idea again for the motion-planning reference implementation:
          # the 2D RRT canvas, served alongside its own deck
          mkdir -p site/motion_planning/reference
          cp -r motion_planning/reference/. site/motion_planning/reference/
          cp site/motion_planning/reference/search_canvas.html site/motion_planning/reference/index.html
          # same idea again for the behavior-trees reference implementation:
          # the tick engine, the joint trajectory, the action server and
          # the trees, served as a buildless page alongside its own deck.
          # It fetches plans/mr2_arm_workspace.json at runtime, so it has
          # to be served over HTTP -- which it is, here.
          mkdir -p site/behavior_trees/reference
          cp -r behavior_trees/reference/. site/behavior_trees/reference/
          cp site/behavior_trees/reference/behavior_trees.html site/behavior_trees/reference/index.html
          # GitHub Pages only ever consults a 404.html at the site root, and
          # each Slidev deck is its own separately-built SPA with its own JS
          # bundle -- one deck's 404.html can't correctly bootstrap another
          # deck's slides. Route by path prefix to that deck's own root
          # instead (a real, existing file, so it loads correctly, just
          # landing on slide 1 rather than the originally requested deep
          # slide number).
          cat > site/404.html <<'HTML404'
          <!doctype html>
          <html>
          <head><meta charset="utf-8" /><title>Redirecting&hellip;</title></head>
          <body>
          <script>
            var path = window.location.pathname;
            var decks = ['pathfinding', 'cloth_simulation', 'simulation', 'forward_kinematics', 'inverse_kinematics', 'motion_planning', 'behavior_trees'];
            var target = '/kineval/';
            for (var i = 0; i < decks.length; i++) {
              if (path.indexOf('/kineval/' + decks[i] + '/') === 0) {
                target = '/kineval/' + decks[i] + '/';
                break;
              }
            }
            window.location.replace(target);
          </script>
          </body>
          </html>
          HTML404

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
