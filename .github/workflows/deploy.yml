name: Deploy KinEval Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pathfinding/slides/package-lock.json

      - name: Build the pathfinding Slidev deck
        working-directory: pathfinding/slides
        run: |
          npm install
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r pathfinding/slides/dist site/pathfinding
          cp -r simulation forward_kinematics inverse_kinematics motion_planning kineval site/
          # GitHub Pages only ever consults a 404.html at the site root
          # (not one nested in a subdirectory), so a deep link into a
          # specific slide (e.g. /pathfinding/11) 404s unless the root
          # 404.html can bootstrap that slide's own SPA. Slidev's build
          # already produces an index.html-equivalent 404.html for exactly
          # this purpose (see its own absolute-path asset references) --
          # promote the pathfinding deck's copy to the site root so deep
          # links into it resolve. If a second Slidev deck needs the same
          # treatment later, this will need a real path-dispatching
          # redirect script instead of a single static copy.
          cp site/pathfinding/404.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
