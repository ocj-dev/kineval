name: Deploy KinEval Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pathfinding/slides/package-lock.json

      - name: Build the pathfinding Slidev deck
        working-directory: pathfinding/slides
        run: |
          npm install
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r pathfinding/slides/dist site/pathfinding
          cp -r simulation forward_kinematics inverse_kinematics motion_planning kineval site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
